[build-system]
requires = ["hatchling>=1.21", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "agent-statusline"
dynamic = ["version"]
description = "A dense, width-aware status line for coding agents"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "nachiketbhujbal" }]
keywords = ["claude-code", "statusline", "cli", "tui", "codex"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]
# Runtime dependencies are deliberately empty and should stay that way: the
# status line is spawned several times a second and must work on a machine with
# nothing installed. See docs/adrs/0004-no-runtime-dependencies.md.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
# One entry point with subcommands. Bare `agent-statusline` renders, which is the
# hot path Claude Code spawns several times a second; see cli.py.
agent-statusline = "agent_statusline.cli:main"

[project.urls]
Homepage = "https://github.com/nachiketbhujbal/agent-statusline"
Documentation = "https://github.com/nachiketbhujbal/agent-statusline/tree/main/docs"

# ---------------------------------------------------------------- versioning
# Version comes from git tags via hatch-vcs; there is no version string to keep
# in sync by hand. Tag `v1.2.3` -> version `1.2.3`; untagged commits get a
# development version derived from the distance to the last tag.
[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/agent_statusline/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_statusline"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "install.py", "README.md"]

# ------------------------------------------------------------------ tooling
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
# The status line trades conventional spacing for density in its formatting
# code; E501 and E701 are checked, the rest of the whitespace rules are not
# worth reflowing hot render paths over.
# SIM105 (contextlib.suppress) is refused on purpose: it builds a context
# manager per call, and these are render paths that run several times a second.
# A bare try/except/pass is measurably cheaper and reads no worse here.
ignore = ["E731", "E741", "SIM105"]

[tool.ruff.lint.per-file-ignores]
# Entry points must extend sys.path before importing the package, so their
# imports genuinely cannot all sit at the top of the file.
"src/agent_statusline/statusline.py" = ["E402", "E501", "E701", "E702"]
"src/agent_statusline/ledger.py" = ["E402", "E501"]
"install.py" = ["E402"]
"src/agent_statusline/hooks/*.py" = ["E402"]
"tests/conftest.py" = ["E402"]
# statusline.py and transcript.py are written in a deliberately compact style:
# one-line guards and multiple statements per line keep each row's formatting
# readable as a unit. Reflowing them would hurt the thing they optimise for.
"src/agent_statusline/transcript.py" = ["E501", "E701", "E702"]
"src/agent_statusline/probes.py" = ["E501"]

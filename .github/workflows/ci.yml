name: CI

# Cost policy: docs/adrs/0018-budget-hosted-ci.md
#
# Private-repository Actions minutes are billed per job, rounded UP to the whole
# minute, with a 10x multiplier on macOS. Two consequences drive this file:
#
#   1. A job that finishes in ten seconds still bills a full minute, so four
#      single-purpose Linux jobs cost four minutes to do about ninety seconds of
#      work. Work that needs no isolation is therefore combined into one job.
#   2. Hosted macOS is the dominant cost. It is not part of the default run; it
#      is requested deliberately through workflow_dispatch.
#
# Public repositories get unlimited free minutes, at which point the macOS gate
# can be relaxed -- but the shape below is worth keeping regardless.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      hosted_macos:
        description: "Also run hosted macOS (billed at 10x -- check the account ledger first)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything that needs no isolation from anything else, in one job: lint, the
  # dependency-policy guard, both install shapes, and the build.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0        # hatch-vcs derives the version from tags
      - name: complete PR or main ancestry is public-safe
        run: python scripts/audit_reachable_history.py --ref HEAD

      - name: preserve the documentation-only cost boundary
        id: scope
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "full=true" >> "${GITHUB_OUTPUT}"
          elif git diff --quiet "${BASE_SHA}" HEAD -- . ':(exclude)docs/**' ':(exclude)**/*.md' ':(exclude)LICENSE'; then
            echo "full=false" >> "${GITHUB_OUTPUT}"
          else
            echo "full=true" >> "${GITHUB_OUTPUT}"
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.scope.outputs.full == 'true'
        with:
          python-version: "3.12"
      - if: steps.scope.outputs.full == 'true'
        run: pip install ruff build

      - name: lint
        if: steps.scope.outputs.full == 'true'
        run: ruff check src tests scripts install.py

      - name: no runtime dependencies (ADR 0004)
        if: steps.scope.outputs.full == 'true'
        run: |
          python - <<'PY'
          import sys, tomllib
          deps = tomllib.load(open("pyproject.toml", "rb"))["project"]["dependencies"]
          if deps:
              sys.exit(f"runtime dependencies are not allowed, found: {deps}")
          print("no runtime dependencies")
          PY
      - name: the package imports with nothing installed
        if: steps.scope.outputs.full == 'true'
        run: PYTHONPATH=src python -c "import agent_statusline.statusline"

      - name: documentation and public-readiness policy
        if: steps.scope.outputs.full == 'true'
        run: |
          python scripts/verify_docs.py
          python scripts/verify_public_readiness.py

      - name: generated main commit uses the protected release identity
        if: steps.scope.outputs.full == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python scripts/verify_public_readiness.py --release-commit HEAD

      - name: install smoke -- checkout shape
        if: steps.scope.outputs.full == 'true'
        env:
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/claude-checkout
        run: |
          python3 install.py
          python3 - <<'PY'
          import json, os, shlex, sys
          d = os.environ["CLAUDE_CONFIG_DIR"]
          cfg = json.load(open(os.path.join(d, "settings.json")))
          expected = f"{shlex.quote(sys.executable)} {shlex.quote(os.path.join(d, 'statusline', 'statusline.py'))}"
          assert cfg["statusLine"]["command"] == expected, cfg
          assert os.path.islink(os.path.join(d, "statusline"))
          print("checkout shape wired correctly")
          PY
          python3 install.py --uninstall

      - name: build
        if: steps.scope.outputs.full == 'true'
        run: python -m build

      - name: install smoke -- installed shape
        if: steps.scope.outputs.full == 'true'
        env:
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/claude-installed
          AGENT_STATUSLINE_STATE: ${{ runner.temp }}/state
          HOME: ${{ runner.temp }}/statusline-home
          COLUMNS: "240"
        run: |
          mkdir -p "$HOME"
          pip install --no-deps --force-reinstall dist/*.whl
          python tests/fixture_payload.py \
            --workspace "${RUNNER_TEMP}/statusline-workspace" \
            --output "${RUNNER_TEMP}/statusline-payload.json"
          mkdir -p "${RUNNER_TEMP}/statusline-cwd"
          cd "${RUNNER_TEMP}/statusline-cwd"
          agent-statusline install
          python - <<'PY'
          import json, os
          d = os.environ["CLAUDE_CONFIG_DIR"]
          cfg = json.load(open(os.path.join(d, "settings.json")))
          cmd = cfg["statusLine"]["command"]
          assert cmd.strip('"').endswith("agent-statusline"), cmd
          assert not os.path.exists(os.path.join(d, "statusline")), "must not symlink"
          hooks = [h["command"] for v in cfg["hooks"].values() for g in v for h in g["hooks"]]
          assert all(" hook " in h for h in hooks), hooks
          print("installed shape wired correctly")
          PY
          agent-statusline version
          agent-statusline --help > /dev/null
          agent-statusline selftest
          agent-statusline < "${RUNNER_TEMP}/statusline-payload.json" \
            > "${RUNNER_TEMP}/statusline-render.txt"
          python - <<'PY'
          import os, sys
          sys.path.insert(0, os.path.join(os.environ["GITHUB_WORKSPACE"], "tests"))
          from fixture_payload import verify_render_contract
          from agent_statusline.statusline import ORDER
          output = open(
              os.path.join(os.environ["RUNNER_TEMP"], "statusline-render.txt"),
              encoding="utf-8",
          ).read()
          verify_render_contract(output, ORDER)
          print("installed wheel emitted the exact transcript-backed renderer contract")
          PY
          for h in session-end context-guard timestamp-user timestamp-stop; do
            echo '{"session_id":"ci"}' | agent-statusline hook "$h" > /dev/null
          done
          agent-statusline ledger show
          agent-statusline uninstall

      - name: distribution archives satisfy evidence and privacy policy
        if: steps.scope.outputs.full == 'true'
        run: python scripts/verify_artifacts.py dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.scope.outputs.full == 'true'
        with:
          name: dist
          path: dist/

  # Python-version isolation is the point of this matrix, so it stays split.
  # Linux only: nothing here is platform-specific except the memory probe, which
  # the macOS job below covers when it is deliberately requested.
  test:
    needs: checks
    if: needs.checks.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest
      - run: python -m pytest tests -v

  # One stable branch-protection context. It succeeds only when the always-on
  # policy job passed and the version matrix either passed or was deliberately
  # skipped for a documentation-only change.
  required:
    if: always()
    needs: [checks, test]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: enforce the complete required CI result
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          TEST_RESULT: ${{ needs.test.result }}
          FULL_RUN: ${{ needs.checks.outputs.full }}
        run: |
          test "${CHECKS_RESULT}" = "success"
          if [ "${FULL_RUN}" = "true" ]; then
            test "${TEST_RESULT}" = "success"
          elif [ "${FULL_RUN}" = "false" ]; then
            test "${TEST_RESULT}" = "skipped"
          else
            echo "invalid full-scope result: ${FULL_RUN}" >&2
            exit 1
          fi

  # Hosted macOS certification. Off by default -- one job here costs the same
  # allowance as ten Linux jobs. Request it before a vX.Y.0 release, or for a
  # change to the macOS-specific probes in probes.py (vm_stat, sysctl, ps).
  macos:
    if: github.event_name == 'workflow_dispatch' && inputs.hosted_macos
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest tests -v
      - name: the macOS-specific probes actually return data
        run: |
          PYTHONPATH=src python - <<'PY'
          from agent_statusline import probes
          mem = probes.memory()
          assert mem.get("total"), mem
          assert mem.get("pct") is not None, mem
          print(f"vm_stat/sysctl probe ok: {mem['pct']:.0f}% of {mem['total']} bytes")
          PY

name: Release

# Linux only, deliberately: the published artifacts are a pure-Python wheel and
# an sdist, so nothing about building them is platform-specific. Platform
# evidence belongs to CI, not to the release build.
#
# A tag is IMMUTABLE (docs/adrs/0019-release-tags-are-immutable.md). This
# workflow is post-tag evidence, never authorization to move one: if it fails,
# the fix is a new patch version, not a force-pushed tag.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0        # hatch-vcs reads the tag being built
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install build pytest

      - name: documentation and public-readiness policy
        run: |
          python scripts/verify_docs.py
          python scripts/verify_public_readiness.py
          python scripts/verify_public_readiness.py --release-tag "${GITHUB_REF_NAME}"

      - name: tests must pass before anything is published
        run: python -m pytest tests

      - run: python -m build

      - name: distribution archives exclude private workspace state
        run: python scripts/verify_artifacts.py dist/*

      - name: the built artifacts carry the tagged version
        run: |
          python - <<'PY'
          import os, pathlib, sys
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          names = [p.name for p in pathlib.Path("dist").iterdir()]
          if not all(tag in n for n in names):
              sys.exit(f"tag {tag!r} does not match built artifacts {names}")
          print(f"artifacts match tag {tag}: {names}")
          PY

      - name: publish a GitHub release with the artifacts
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true

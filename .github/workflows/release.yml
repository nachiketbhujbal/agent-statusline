name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0        # hatch-vcs reads the tag being built
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build pytest
      - name: tests must pass before anything is published
        run: python -m pytest tests
      - run: python -m build
      - name: publish a GitHub release with the artifacts
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true

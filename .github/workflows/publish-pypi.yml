name: Publish to PyPI

# Promote an existing immutable GitHub Release. This workflow never rebuilds
# distributions and never accepts stored package-index credentials.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact published release tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-pypi-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.identity.outputs.artifact_name }}
      version: ${{ steps.identity.outputs.version }}
      wheel_name: ${{ steps.identity.outputs.wheel_name }}
      wheel_sha256: ${{ steps.identity.outputs.wheel_sha256 }}
      sdist_name: ${{ steps.identity.outputs.sdist_name }}
      sdist_sha256: ${{ steps.identity.outputs.sdist_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.5"
      - run: uv sync --locked --group dev --group release --no-install-project

      - name: bind promotion to exact main and an immutable release tag
        id: release
        env:
          TAG: ${{ inputs.tag }}
        run: |
          test "${GITHUB_EVENT_NAME}" = "workflow_dispatch"
          test "${GITHUB_REF}" = "refs/heads/main"
          test "$(git cat-file -t "refs/tags/${TAG}")" = "tag"
          TAG_COMMIT="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          git merge-base --is-ancestor "${TAG_COMMIT}" "${GITHUB_SHA}"
          echo "tag_commit=${TAG_COMMIT}" >> "${GITHUB_OUTPUT}"

      - name: download the exact published GitHub Release pair
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          test "$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq .isDraft)" = "false"
          test "$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json isPrerelease --jq .isPrerelease)" = "false"
          mkdir release-dist
          gh release download "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir release-dist \
            --pattern 'agent_statusline-*.whl' \
            --pattern 'agent_statusline-*.tar.gz'

      - name: release assets remain valid distributions
        run: |
          uv run --no-sync python scripts/verify_artifacts.py release-dist/*
          uv run --no-sync twine check --strict release-dist/*

      - name: bind the exact promotion artifact identities
        id: identity
        env:
          ARTIFACT_NAME: release-distributions-${{ steps.release.outputs.tag_commit }}
          TAG: ${{ inputs.tag }}
        run: |
          uv run --no-sync python scripts/release_artifacts.py prepare \
            --directory release-dist \
            --tag "${TAG}" \
            --artifact-name "${ARTIFACT_NAME}" \
            --github-output "${GITHUB_OUTPUT}" \
            --github-summary "${GITHUB_STEP_SUMMARY}"

      - name: TestPyPI already reports the exact promotion pair
        env:
          VERSION: ${{ steps.identity.outputs.version }}
          WHEEL_NAME: ${{ steps.identity.outputs.wheel_name }}
          WHEEL_SHA256: ${{ steps.identity.outputs.wheel_sha256 }}
          SDIST_NAME: ${{ steps.identity.outputs.sdist_name }}
          SDIST_SHA256: ${{ steps.identity.outputs.sdist_sha256 }}
        run: |
          python scripts/verify_package_index.py \
            --index testpypi \
            --project agent-statusline \
            --version "${VERSION}" \
            --wheel-name "${WHEEL_NAME}" \
            --wheel-sha256 "${WHEEL_SHA256}" \
            --sdist-name "${SDIST_NAME}" \
            --sdist-sha256 "${SDIST_SHA256}" \
            --attempts 3 \
            --delay-seconds 2 \
            --timeout-seconds 10

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.identity.outputs.artifact_name }}
          path: release-dist
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 1

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: pypi
      url: https://pypi.org/p/agent-statusline/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.prepare.outputs.artifact_name }}
          path: release-dist
      - name: publish the exact artifacts to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: release-dist/

  verify:
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.9"
      - name: PyPI reports the exact promoted artifacts
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          WHEEL_NAME: ${{ needs.prepare.outputs.wheel_name }}
          WHEEL_SHA256: ${{ needs.prepare.outputs.wheel_sha256 }}
          SDIST_NAME: ${{ needs.prepare.outputs.sdist_name }}
          SDIST_SHA256: ${{ needs.prepare.outputs.sdist_sha256 }}
        run: |
          python scripts/verify_package_index.py \
            --index pypi \
            --project agent-statusline \
            --version "${VERSION}" \
            --wheel-name "${WHEEL_NAME}" \
            --wheel-sha256 "${WHEEL_SHA256}" \
            --sdist-name "${SDIST_NAME}" \
            --sdist-sha256 "${SDIST_SHA256}" \
            --attempts 12 \
            --delay-seconds 5 \
            --timeout-seconds 10
      - name: install the exact PyPI wheel and run its isolated self-test
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          AGENT_STATUSLINE_STATE: ${{ runner.temp }}/agent-statusline-pypi-state
        run: |
          python -m venv pypi-venv
          pypi-venv/bin/python -m pip install \
            --disable-pip-version-check \
            --no-cache-dir \
            --no-deps \
            --only-binary=:all: \
            --index-url https://pypi.org/simple/ \
            --retries 4 \
            --timeout 10 \
            "agent-statusline==${VERSION}"
          test "$(pypi-venv/bin/agent-statusline --version)" = "${VERSION}"
          pypi-venv/bin/agent-statusline selftest
